<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dossier Detail Timeline Prototype V4</title>
    <meta name="description" content="Four-frame dossier layout with a dropdown phase viewer loading SVG artwork." />
    <link rel="stylesheet" href="frames-detail-v4.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="title-bar">
        <div class="title-bar__main">
          <div>
            <p class="eyebrow">Formal Grievance Dossier</p>
            <h1>Systemic Failures &amp; Duty of Care</h1>
          </div>
          <div class="timeline-toolbar" role="group" aria-label="Phase timeline selector">
            <button class="phase-button is-active" type="button" data-phase-asset="page-1.svg">Phase 1</button>
            <button class="phase-button" type="button" data-phase-asset="page-2.svg">Phase 2</button>
            <button class="phase-button" type="button" data-phase-asset="page-3.svg">Phase 3</button>
          </div>
        </div>
        <section id="timelinePanel" class="timeline-panel">
          <div class="timeline-panel__header">
            <h2 id="phaseTitle">Phase 1</h2>
            <p id="phaseStatus">Loading page-1.svg…</p>
          </div>
          <div class="timeline-viewport">
            <div class="timeline-scroll" tabindex="0" aria-label="Horizontal timeline scroll area">
              <object
                id="phaseAsset"
                class="phase-asset"
                type="image/svg+xml"
                data="./page-1.svg"
                aria-label="Phase timeline artwork"
              ></object>
            </div>
          </div>
        </section>
      </header>

      <main class="workspace">
        <aside class="rail" aria-label="Main report contents">
          <div class="rail__header">
            <div>
              <p class="eyebrow">Menu frame</p>
              <h2>Main report</h2>
            </div>
          </div>
          <div class="rail__body">
            <ul id="reportTree" class="menu-tree"></ul>
          </div>
        </aside>

        <section class="content-frame" aria-label="Main report content">
          <div id="mainFrameHeader" class="content-frame__header"></div>
          <div id="mainFrameBody" class="content-frame__body"></div>
        </section>

        <section class="content-frame" aria-label="Appendix content">
          <div id="appendixFrameHeader" class="content-frame__header"></div>
          <div id="appendixFrameBody" class="content-frame__body"></div>
        </section>

        <aside class="rail rail--appendix" aria-label="Appendix contents">
          <div class="rail__header">
            <div>
              <p class="eyebrow">Menu frame</p>
              <h2>Appendix</h2>
            </div>
          </div>
          <div class="rail__body">
            <ul id="appendixTree" class="menu-tree"></ul>
          </div>
        </aside>
      </main>
    </div>

    <script src="frames-detail-v4.js" defer></script>
  </body>
</html>
